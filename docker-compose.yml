name: accounting-interview

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_DEBUG: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: accounting
  POSTGRES_USER: accounting
  POSTGRES_PASSWORD: accounting
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
  CELERY_RESULT_BACKEND: rpc://
  EXTERNAL_ACCOUNTING_BASE_URL: http://mock-accounting:8001
  EXTERNAL_ACCOUNTING_API_KEY: dev-secret-key
  ACCOUNTING_SYNC_INTERVAL_SECONDS: "1800"
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

x-backend: &backend
  build: ./backend
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mock-accounting:
    build: ./mock-service
    ports:
      - "8001:8001"
    environment:
      API_KEY: dev-secret-key
      # Turn the chaos down while you are building if it gets in the way, but
      # put it back before you submit — we will run it at these values.
      FAILURE_RATE: "0.15"
      SLOW_RATE: "0.10"
      DRIFT_INTERVAL_SECONDS: "60"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

  worker:
    <<: *backend
    environment:
      <<: *backend-env
    command: celery -A config worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started

  beat:
    <<: *backend
    environment:
      <<: *backend-env
    command: celery -A config beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
